name: Check Upstream & Release Slim RPM

on:
  schedule:
    - cron: '0 18 * * *'   # 北京时间 02:00
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild current version'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      url: ${{ steps.check.outputs.url }}
      need_build: ${{ steps.check.outputs.need_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Query upstream deb
        id: check
        run: |
          set -e
          JSON="$(curl -fsSL 'https://www.workbuddy.cn/v2/update?platform=workbuddy-linux-x64-deb')"
          echo "upstream: $JSON"
          VERSION="$(echo "$JSON" | jq -r '.version // .data.version // empty')"
          URL="$(echo "$JSON" | jq -r '.url // .data.url // empty')"
          if [ -z "$VERSION" ] || [ -z "$URL" ]; then
            echo "无法解析版本或下载地址"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          if gh release view "slim-rpm-v$VERSION" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio cpio file ruby ruby-dev build-essential jq
          sudo gem install --no-document fpm

      - name: Download official deb
        run: |
          mkdir -p downloads
          curl -fL --retry 3 -o downloads/workbuddy.deb "${{ needs.check.outputs.url }}"
          ls -lh downloads/

      - name: Slim deb
        run: |
          bash scripts/slim-deb.sh downloads/workbuddy.deb
          SLIM_DEB="$(ls -t *.deb | head -1)"
          mv "$SLIM_DEB" downloads/workbuddy-slim.deb

      - name: Convert to rpm
        run: |
          bash scripts/deb-to-rpm.sh downloads/workbuddy-slim.deb downloads/workbuddy-slim.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slim-rpm
          path: downloads/*.rpm

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: slim-rpm-v${{ needs.check.outputs.version }}
          name: WorkBuddy slim RPM v${{ needs.check.outputs.version }}
          files: downloads/*.rpm
          generate_release_notes: true
